<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【完成版】My Todos</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="app">
        <div class="header">
            <h1 class="header-title">Todos</h1>
            <button class="header-button" id="purge-button">Purge</button>
        </div>

        <div class="todo-list" id="todo-list">
            <div class="todo-item">
                <input type="checkbox" class="todo-checkbox">
                <span class="todo-text">aaa</span>
                <button class="todo-delete-button">X</button>
            </div>
            <div class="todo-item">
                <input type="checkbox" class="todo-checkbox">
                <span class="todo-text">bbb</span>
                <button class="todo-delete-button">X</button>
            </div>
            <div class="todo-item">
                <input type="checkbox" class="todo-checkbox">
                <span class="todo-text">ccc</span>
                <button class="todo-delete-button">X</button>
            </div>
            <div class="todo-item">
                <input type="checkbox" class="todo-checkbox">
                <span class="todo-text">ddd</span>
                <button class="todo-delete-button">X</button>
            </div>
        </div>

        <div class ="todo-input">
            <input type="text" class="todo-input-field" id="todo-input-field">
            <button class="todo-add-button" id="todo-add-button">Add</button>
        </div>
    </div>
    <script src="./js/main.js"></script>
</body>
</html>
