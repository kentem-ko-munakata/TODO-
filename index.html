<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【完成版】My Todos</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="app">
        <div class="header">
            <h1 class="header-title">Todos</h1>
            <button class="header-button" id="purge-button">Purge</button>
        </div>

        <div class="todo-list" id="todo-list">

        <form class ="todo-input">

            <button type="submit" class="todo-add-button" id="todo-add-button">Add</button>
        </form>
    </div>
    <script src="./js/main.js"></script>
</body>
</html>
